[package]
name = "tabex"
version = "0.5.1"
edition = "2021"
description = "Gerenciador de arquivos com abas e grupos de abas coloridos, inspirado no Explorador de Arquivos do Windows"
license = "MIT"
repository = "https://github.com/raphaelmj83/tabex"
readme = "README.md"
keywords = ["file-manager", "explorer", "egui", "tabs"]
categories = ["gui", "filesystem"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "system_fonts", "wayland", "x11"] }
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_extras = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
chrono = "0.4"
walkdir = "2"
trash = "5"
open = "5"
humansize = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
self-replace = "1"
semver = "1"
sha2 = "0.11"
notify = "8"
fs4 = { version = "1", features = ["sync"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
raw-window-handle = "0.6"

# HTTP para o atualizador: TLS nativo (Schannel) no Windows, rustls nos demais.
[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
windows-core = "0.62"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_WNet",
] }

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
egui_kittest = { version = "0.37", default-features = false }

[features]
screenshot = ["eframe/__screenshot"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
