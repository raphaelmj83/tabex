[package]
name = "tabex"
version = "0.1.0"
edition = "2021"
description = "Gerenciador de arquivos com abas e grupos de abas coloridos, inspirado no Explorador de Arquivos do Windows"
license = "MIT"
repository = "https://github.com/raphaelmj83/tabex"
readme = "README.md"
keywords = ["file-manager", "explorer", "egui", "tabs"]
categories = ["gui", "filesystem"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "system_fonts", "wayland", "x11"] }
egui = "0.37"
egui_extras = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
chrono = "0.4"
walkdir = "2"
trash = "5"
open = "5"
humansize = "2"

[features]
screenshot = ["eframe/__screenshot"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
